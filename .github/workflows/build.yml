name: Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build Swift package
        run: cd ClaudeApprover && swift build -c release

      - name: Verify Python hooks syntax
        run: |
          python3 -c "import py_compile; py_compile.compile('hook/permission_request.py', doraise=True)"
          python3 -c "import py_compile; py_compile.compile('hook/post_tool_use.py', doraise=True)"
